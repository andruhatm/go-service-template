<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testPublic()">Test Public Endpoint</button>
    <button onclick="testProtected()">Test Protected Endpoint (will fail without auth)</button>
    <pre id="result"></pre>

    <script>
        function testPublic() {
            fetch('http://localhost:8081/public')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('result').textContent = 'Public endpoint response: ' + data;
                })
                .catch(error => {
                    document.getElementById('result').textContent = 'Error: ' + error;
                });
        }

        function testProtected() {
            fetch('http://localhost:8081/api/me')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('result').textContent = 'Protected endpoint response: ' + data;
                })
                .catch(error => {
                    document.getElementById('result').textContent = 'Error: ' + error;
                });
        }
    </script>
</body>
</html>
