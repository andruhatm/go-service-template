<h2 mat-dialog-title>Добавить виджет</h2>

<mat-dialog-content>
  <form [formGroup]="widgetForm">
    <div class="form-group">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Название виджета</mat-label>
        <input matInput formControlName="title" placeholder="Введите название" />
        <mat-error *ngIf="widgetForm.get('title')?.hasError('required')">
          Название обязательно
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-group">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Тип виджета</mat-label>
        <mat-select formControlName="type">
          <mat-option value="line-chart">Линейный график</mat-option>
          <mat-option value="bar-chart">Столбчатый график</mat-option>
          <mat-option value="gauge">Датчик</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-group">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Объект мониторинга</mat-label>
        <input 
          type="text"
          matInput 
          formControlName="objectSearch"
          [matAutocomplete]="autoObject"
          placeholder="Начните вводить название...">
        <mat-icon matSuffix>search</mat-icon>
        <mat-autocomplete 
          #autoObject="matAutocomplete"
          [displayWith]="displayMonObject.bind(this)"
          (optionSelected)="onObjectSelected($event.option.value)">
          <mat-option *ngFor="let obj of filteredMonObjects | async" [value]="obj">
            {{ obj.name }} <span *ngIf="obj.type" class="type-label">({{ obj.type }})</span>
          </mat-option>
        </mat-autocomplete>
        <mat-error *ngIf="widgetForm.get('objectId')?.hasError('required')">
          Выберите объект
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-group">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Метрика</mat-label>
        <input 
          type="text"
          matInput 
          formControlName="metricSearch"
          [matAutocomplete]="autoMetric"
          placeholder="Начните вводить название...">
        <mat-icon matSuffix>search</mat-icon>
        <mat-autocomplete 
          #autoMetric="matAutocomplete"
          [displayWith]="displayMetric.bind(this)"
          (optionSelected)="onMetricSelected($event.option.value)">
          <mat-option *ngFor="let metric of filteredMetrics | async" [value]="metric">
            <div class="metric-option">
              <span class="metric-name">{{ metric.name }}</span>
              <span *ngIf="metric.group" class="metric-group">{{ metric.group }}</span>
            </div>
          </mat-option>
        </mat-autocomplete>
        <mat-error *ngIf="widgetForm.get('metricId')?.hasError('required')">
          Выберите метрику
        </mat-error>
      </mat-form-field>
    </div>
  </form>

  <div *ngIf="loading" class="loading-indicator">
    <mat-spinner diameter="30"></mat-spinner>
    <p>Загрузка данных...</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Отмена</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!widgetForm.valid || loading">
    Добавить
  </button>
</mat-dialog-actions>
