
<div class="container">

  <div class="nav__categories js-dropdown">
    <div class="nav__select">
      <h3>Прогнозирование</h3>
      <div style="display: flex; gap: 10px;">
        <button mat-flat-button color="primary" (click)="openDialog()">
          <mat-icon>add</mat-icon>
          Создать прогноз
        </button>
        <button mat-flat-button color="accent" (click)="refreshForecasts()">
          <mat-icon>refresh</mat-icon>
          Обновить
        </button>
      </div>
    </div>
  </div>
  <div class="nav">
  </div>
    <div class="posts">
      <div class="posts__body">
        <div *ngIf="loading" style="text-align: center; padding: 20px;">
          <mat-spinner></mat-spinner>
          <p>Загрузка прогнозов...</p>
        </div>
        <div *ngIf="isEmptyResponse && !loading" style="text-align: center; padding: 40px;">
          <mat-icon style="font-size: 48px; height: 48px; width: 48px; color: #999;">info</mat-icon>
          <p>Нет прогнозов. Создайте новый прогноз.</p>
        </div>
        <div class="table__view" *ngIf="!loading && !isEmptyResponse">
          <table mat-table [dataSource]="this.dataSource" matSort style="background-color: white">
            <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
              <th mat-header-cell *matHeaderCellDef>
                {{column.header}}
              </th>
              <td mat-cell *matCellDef="let row">
                <span *ngIf="column.columnDef !== 'status' && column.columnDef !== 'actions'">
                  {{column.cell(row)}}
                </span>
                <span *ngIf="column.columnDef === 'status'">
                  <mat-chip [style.background-color]="getStatusColor(row.status)" style="color: white;">
                    <mat-icon style="font-size: 16px; height: 16px; width: 16px; margin-right: 4px;">
                      {{getStatusIcon(row.status)}}
                    </mat-icon>
                    {{row.status}}
                  </mat-chip>
                </span>
                <span *ngIf="column.columnDef === 'actions'">
                  <button mat-icon-button color="warn" (click)="deleteForecast(row)" matTooltip="Удалить">
                    <mat-icon>delete</mat-icon>
                  </button>
                </span>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      </div>
      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons style="background-color: white"></mat-paginator>
    </div>
</div>
