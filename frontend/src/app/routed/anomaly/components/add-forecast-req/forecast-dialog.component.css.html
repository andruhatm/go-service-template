<div class="container feed">


  <div class="nav">
    <div class="nav__categories js-dropdown">
      <div class="nav__select">
        <div class="btn-select" data-dropdown-btn="categories">Спецификация</div>
        <nav class="dropdown dropdown--design-01" data-dropdown-list="categories">
          <ul class="dropdown__catalog row">
            <ul *ngFor="let category of categories" class="dropdown__catalog row">
              <li class="col-xs-6"><a (click)="handleCategoryClick(category)" class="category"><i
                [class]="category.color"></i>{{ category.nameCategory }}</a>
              </li>
            </ul>
          </ul>
        </nav>
      </div>
      <button mat-flat-button color="primary" (click)="openDialog()">Создать КПИ</button>
    </div>
  </div>


  <div class="posts">
    <div class="posts__body">
      <table *ngIf="metric" mat-table [dataSource]="this.dataSource" class="mat-elevation-z8 demo-table">
        <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
          <th mat-header-cell *matHeaderCellDef>
            {{column.header}}
          </th>
          <td mat-cell *matCellDef="let row">
            {{column.cell(row)}}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <table *ngIf="!metric" mat-table [dataSource]="this.dataSource2" class="mat-elevation-z8 demo-table">
        <ng-container *ngFor="let column of columns2" [matColumnDef]="column.columnDef">
          <th mat-header-cell *matHeaderCellDef>
            {{column.header}}
          </th>
          <td mat-cell *matCellDef="let row">
            {{column.cell(row)}}
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns2"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns2;"></tr>
      </table>
    </div>
  </div>
</div>
